<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pedagogue</title>
    <meta http-equiv="refresh" content="0; url=auth.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">

    <!-- Analytics Configuration -->
    <script>
        window.ANALYTICS_CONFIG = {
            ga4MeasurementId: 'G-XXXXXXXXXX',
            yandexMetrikaId: '12345678'
        };
    </script>
    <script src="js/analytics.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #5E2611 0%, #A81E14 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash {
            text-align: center;
            opacity: 0;
            animation: fadeIn 280ms cubic-bezier(0.16, 1, 0.3, 1) 80ms forwards;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 24px;
        }
        .logo .highlight { font-weight: 500; opacity: 0.85; }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 700ms linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .splash { animation: none; opacity: 1; }
            .spinner { animation-duration: 0.01ms; }
        }
        noscript { display: block; margin-top: 20px; font-size: 14px; }
        noscript a { color: #fff; text-decoration: underline; }
    </style>
    <link rel="stylesheet" href="css/palm-oil-theme.css">
</head>
<body>
    <div class="splash">
        <div class="logo">Virtual<span class="highlight">Pedagogue</span></div>
        <div class="spinner" aria-label="Загрузка"></div>
        <noscript>
            <a href="auth.html">Перейти в личный кабинет</a>
        </noscript>
    </div>
    <script>
        // Instant client-side redirect (meta-refresh fallback above for no-JS)
        window.location.replace('auth.html');
    </script>
</body>
</html>
